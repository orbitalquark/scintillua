name: test
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install lua5.1 lua5.4 lua-lpeg lua-filesystem --no-install-recommends -y

      - name: Run unit tests
        run: lua5.4 tests.lua
